<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted Audit</title>
    <script>
      /* Apply saved display settings before first paint (product-ux.md). */
      (function () {
        try {
          var d = document.documentElement;
          d.dataset.contrast = localStorage.getItem('haunted-audit.contrast') === 'on' ? 'high' : 'normal';
          if (localStorage.getItem('haunted-audit.calm') === 'on') d.dataset.calm = 'true';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
