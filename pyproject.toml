[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-audit-keyboard"
version = "0.1.0"
description = "Keyboard-only accessibility agent spike for Haunted Audit."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.6",
    "playwright>=1.49",
    "strands-agents>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["."]
addopts = "-q"
