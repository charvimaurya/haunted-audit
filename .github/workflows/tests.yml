name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tests/journeys/package-lock.json
            dashboard/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Install the journey test (regression guard)
        working-directory: tests/journeys
        run: npm ci
      - name: Run pytest
        run: python -m pytest
      - name: Run Playwright journey regression guard
        working-directory: tests/journeys
        run: npx playwright test
      - name: Browser test with the real API (user-typed test details)
        working-directory: dashboard
        env:
          PYTHON: python
          CI: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e:api

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: No test person name in the built bundle
        run: |
          npm run build
          node scripts/check_bundle_names.mjs
      - name: Browser tests (ghost overlap)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
