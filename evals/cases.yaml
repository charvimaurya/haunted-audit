# Eval cases: one per known planted barrier and one per failure already seen.
# Rules:
#   - Labels come from a file in the repo (see label_source). Never invent or change a label to improve a score.
#   - Numbers are copied from a measured run (see evidence). Not measured means "not measured".
#   - Add a case for every new failure. Keep ids stable.
# Fields: id, kind (planted_barrier | failure), target, expected, observed, evidence, label_source, status, recorded.

cases:
  - id: bank-001
    kind: planted_barrier
    target: fixtures/haunted_bank/index.html?variant=broken
    barrier: >-
      Send Payment is a div (class pay-btn) with an onclick handler and no tabindex or role,
      so it is not in the tab order. The fixed variant uses a real button.
    element: div.pay-btn
    wcag: ["2.1.1", "4.1.2"]
    expected:
      verdict: BLOCKED
      reason_code: TARGET_NOT_FOCUSABLE
      blocked_element: div.pay-btn
    observed: >-
      Scripted walker: 5 of 5 broken runs BLOCKED with TARGET_NOT_FOCUSABLE on div.pay-btn.
      LLM agent: not run.
    evidence:
      - docs/evidence.md
      - artifacts/eval/results.json (git-ignored; generated_at 2026-11-06T11:16:34Z)
    label_source: >-
      README.md (fixture description) and fixtures/haunted_bank/index.html;
      WCAG tags from the Critical Ghost Detected card in design/Haunted_Audit_Final_UI_v7.png.
      bank/PLANTED.md does not exist yet, so no other planted barrier is labelled.
    status: open
    recorded: 2026-11-20

  - id: fail-001
    kind: failure
    target: fixtures/haunted_bank/index.html?variant=broken
    agent_mode: llm
    expected: BLOCKED with TARGET_NOT_FOCUSABLE in at least 4 of 5 runs
    observed: >-
      0 of 5 runs executed. Every run stopped with stop_reason "error": AWS credentials are not configured.
      No tokens were recorded. No accuracy was measured.
    evidence:
      - artifacts/eval/results.json (git-ignored)
      - docs/evidence.md
      - docs/decision-log.md
    label_source: product-rules.md reliability gate (correct broken run = BLOCKED, TARGET_NOT_FOCUSABLE, measured box on div.pay-btn)
    status: open
    next: Configure AWS credentials, then run `python -m agent.eval.run_eval --modes llm --runs 5`.
    recorded: 2026-11-20

  - id: fail-002
    kind: failure
    target: fixtures/haunted_bank/index.html?variant=fixed
    agent_mode: llm
    expected: PASSED with no reason code in at least 4 of 5 runs
    observed: >-
      0 of 5 runs executed. Every run stopped with stop_reason "error": AWS credentials are not configured.
      No tokens were recorded. No accuracy was measured.
    evidence:
      - artifacts/eval/results.json (git-ignored)
      - docs/evidence.md
      - docs/decision-log.md
    label_source: product-rules.md reliability gate (correct fixed run = PASSED, no reason code)
    status: open
    next: Same as fail-001.
    recorded: 2026-11-20

  - id: fail-003
    kind: failure
    target: GitHub Actions workflow .github/workflows/tests.yml
    expected: the workflow runs and its pytest job passes
    observed: >-
      The run failed on commits 1a75e46 (Repo skeleton, 2026-11-08) and 9d41ed2 (2026-11-09).
      It passed from ac5e73a onward. The cause of the earlier failures was not read.
    evidence:
      - GitHub Actions run list for charvimaurya/haunted-audit
    label_source: GitHub Actions run conclusions
    status: resolved
    recorded: 2026-11-20

  - id: fail-004
    kind: failure
    target: GitHub Actions workflow pages (.github/workflows/pages.yml)
    expected: the dashboard build is published
    observed: >-
      The build job passed and the deploy job failed at the "actions/deploy-pages@v4" step on every run
      (bc7d9b7, 59a51b6, 7042eb1). The cause was not read. The published site returned 404.
    evidence:
      - GitHub Actions run list for charvimaurya/haunted-audit
    label_source: GitHub Actions job conclusions
    status: resolved
    note: The workflow file is deleted in the same branch; Vercel is the planned host.
    recorded: 2026-11-20
  - id: fail-005
    kind: failure
    target: Exorcist, exorcist_mode llm (scripts/qa_exorcist.py)
    agent_mode: llm
    expected: a valid diff in at least 4 of 5 runs
    observed: >-
      0 of 5 runs executed. Every fix ended as exorcist_failed: "AWS credentials could not be read: The config
      profile (haunted-audit) could not be found". No tokens were recorded (null). The scripted Exorcist gave 5 of 5
      valid diffs, 5 of 5 verified, 5 of 5 caught in the same script.
    evidence:
      - scripts/qa_exorcist.py output in docs/devlog.md (2026-11-22)
    label_source: .kiro/specs/exorcist/requirements.md REQ-X-18
    status: open
    next: Configure AWS credentials and Bedrock access, build the Bedrock call, then run scripts/qa_exorcist.py.
    recorded: 2026-11-22

  - id: fail-007
    kind: failure
    target: dashboard/src/test/voice-agent.test.tsx > GhostHuntSection voice honesty > does not show hardcoded Voice Found/activate rows before a command runs
    agent_mode: scripted
    expected: >-
      GhostHuntSection renders an article element with accessible name "Voice Agent" (from VoiceAgentPanel)
      when result is null and no command has run.
    observed: >-
      1 of 1 test run failed. Vitest could not find getByRole('article', { name: 'Voice Agent' }) because
      uncommitted WIP in dashboard/src/components/GhostHuntSection.tsx removed the VoiceAgentPanel import
      and replaced it with an AgentCard that does not carry the same ARIA role. The committed HEAD version
      (16fbe46) passes this test; the uncommitted modification breaks it. The loop-evidence commits are not
      the cause.
    evidence:
      - npx vitest run output: 1 failed | 128 passed (dashboard/src/test/voice-agent.test.tsx line 149)
      - git diff HEAD -- dashboard/src/components/GhostHuntSection.tsx (removes VoiceAgentPanel, adds AgentCard)
    label_source: dashboard/src/test/voice-agent.test.tsx (committed at 16fbe46)
    status: open
    next: >-
      The WIP author must ensure that the replacement AgentCard renders with role="article"
      and aria-label="Voice Agent", matching what the test expects, before merging.
    recorded: 2026-11-24

  - id: fail-006
    kind: failure
    target: Verifier voice replay on the patched copy (POST /fixes/{id}/verify, voice_run_id)
    agent_mode: scripted
    expected: voice-command simulation PASSED on the patched copy, so the screens can say "Keyboard and voice"
    observed: >-
      Keyboard journey PASSED on the patched copy; the voice-command simulation was BLOCKED (NO_ACTIVATION) because
      "Could not type in Amount: no accessible label". The scripted Exorcist fixes barrier 1 (Send Payment div) only;
      barrier 2 (Amount has no label, bank/PLANTED.md) still stops a voice user. Seen in every keyboard loop walk on
      2026-11-24 and in agent/tests/test_loop_evidence.py. The screens say "Keyboard only" and "Not verified".
    evidence:
      - scripts/keyboard_loop_walk.py output in docs/pr/item-4-loop-evidence.md
      - docs/evidence/loop-evidence-verify.png
    label_source: bank/PLANTED.md (barrier 2) and .kiro/specs/loop-evidence/requirements.md
    status: open
    next: Owner decides whether the Exorcist also proposes the Amount label fix (a second finding and a second approval).
    recorded: 2026-11-24
    resolution:
      decided: >-
        Owner asked for the loop to run through on 2026-11-24 (voice-agent REQ-VA-13). The scripted Exorcist now
        proposes both changes in one diff for one approval: Send Payment becomes a button and the Amount caption
        becomes a label (4 changed lines, agent/fixes/exorcist.py). Not a second finding and not a second approval.
      agent_mode: scripted
      observed_after: >-
        scripts/qa_exorcist.py, 5 runs: 5 of 5 valid diffs, 5 of 5 PASSED on the patched copy, 5 of 5 BLOCKED with the
        bug put back. scripts/keyboard_loop_walk.py: keyboard PASSED and voice-command simulation PASSED on the patched
        copy, screen says "Keyboard and voice". scripts/keyboard_autoloop_walk.py: both PASSED. The regression copy
        still fails for voice (NO_ACTIVATION), as expected with the bug put back.
      evidence:
        - docs/pr/item-2-1-exorcist-closure.md (QA agent, keyboard loop walk, autoloop walk)
        - agent/tests/test_loop_evidence.py::test_fail_006_is_fixed_voice_passes_on_the_patched_copy (passes on main; fails with the old one-change Exorcist)
      resolved: 2026-11-24
      note: >-
        Two different things are recorded here. The fields above "resolution" are the historical failure as observed on
        2026-11-24 (status open, voice BLOCKED / NO_ACTIVATION on the patched copy) and are kept unchanged. This
        resolution block is the current result: with today's Exorcist the voice replay is PASSED on the patched copy and
        BLOCKED with the bug put back, proved by the regression test listed above. The original "status: open" was
        restored on 2026-11-24 after it had been changed to "resolved" in the integration merge 77586ab.
  - id: fail-008
    kind: failure
    target: Fixed bank variant with typed test details (scripts/record_seed.py, POST /runs with amount)
    agent_mode: scripted
    expected: fixed PASSED; broken BLOCKED / TARGET_NOT_FOCUSABLE
    observed: >-
      The owner's saved record_seed.py output (generated 2026-11-24T11:44:52Z) has fixed BLOCKED / NO_ACTIVATION, and its
      typed amount is "100", not "100.00" (agent_claim_mismatch true:
      the walker pressed Enter, the bank showed "Enter the amount as a positive number with two decimals, for example
      50.00." and moved focus to Amount). The same happens for "100.0", "€100.00", "100,00", "1,000.00" and, by the
      balance limit, "1000.01". "100.00" passes on this branch and on origin/main, so the bank did not change: the
      branch let the tester type any 1 to 40 character amount, and nothing checked the bank's own rule first.
    evidence:
      - artifacts/seed-owner-run-2026-11-24-blocked.json (git-ignored copy of the refused output)
      - agent/tests/test_typed_details.py (good and bad amount tests, record_seed guard tests)
    label_source: fixtures/haunted_bank/index.html (toCents, validate, let balance = 100000)
    status: fixed
    next: >-
      Amount is checked with the bank's rule in the API (clean_amount, 422), the dashboard form ("Use two decimals,
      like 10.00") and record_seed.py, which also refuses to write the seed unless broken is BLOCKED /
      TARGET_NOT_FOCUSABLE and fixed is PASSED.
    recorded: 2026-11-24
